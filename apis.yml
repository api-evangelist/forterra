aid: forterra
name: Forterra
description: >-
  Forterra is a defense autonomy company headquartered in Clarksburg, Maryland,
  that builds combat-proven autonomous mission systems for ground operations in
  contested, GPS-denied, off-road environments. Founded in 2002 as Robotic
  Research and rebranded as Forterra, it retrofits existing military and
  commercial vehicles with self-driving capability through its AutoDrive
  autonomous driving system, the TerraLink modular vehicle-management and
  command-and-control platform, and the OASIS open architecture that lets the
  government and third-party developers add sensors, effectors, and payloads
  without vendor lock-in. Additional offerings span resilient communications,
  sensing, and ruggedized edge-compute hardware. The company is backed by
  SoftBank Vision Fund 2 and Enlightenment Capital and supplies autonomy to
  multiple active U.S. Department of Defense programs. Forterra does not publish
  a public developer API, SDKs, or self-service developer portal; its systems
  are delivered as government and defense-integration programs.
